name: Build macOS installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch == 'arm64' && 'arm64' || 'x64' }}
      - name: Install packaging dependencies
        run: python -m pip install -r requirements.txt PyInstaller==6.22.3
      - name: Build and check app, DMG, and ZIP
        run: bash packaging/build_macos.sh '${{ matrix.arch }}'
      - name: Upload installer and check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ChiikawaPet-macOS-${{ matrix.arch }}
          path: deliverables/*
          if-no-files-found: warn
          retention-days: 30
